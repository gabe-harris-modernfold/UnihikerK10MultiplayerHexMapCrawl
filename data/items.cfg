# ============================================================
# Wasteland Hex Crawl — Item Registry
# ============================================================
# Edit freely. Reboot ESP32 to reload. No firmware flash needed.
#
# Keys (all optional — missing keys default to 0/false/none):
#   id        = unique item ID (1-254; 0 reserved for empty slot)
#   name      = display name (max 15 chars)
#   category  = consumable | equipment | material | key
#   slot      = none | head | body | hand | feet | vehicle
#   stack     = max quantity per inventory slot (default 1)
#   trade     = yes | no   (catalogue flavour only — trades move resource tokens, never items)
#   value     = scrap-equivalent trade value (catalogue flavour only)
#   ll        = Life Level delta (signed). Consumable: heal/harm on use.
#               Equipment: raises the LL ceiling while worn.
#   food      = Food track delta (signed)
#   water     = Water track delta (signed)
#   rad       = Radiation delta (signed). Consumable: on use. Equipment: applied each dawn.
#   mp        = Movement Point delta (signed). Consumable: immediate. Equipment: per day;
#               items with a *_cost only grant it on a dawn where the cost was paid.
#   slots     = Pack slot bonus while equipped (signed; pack caps at 12)
#   water_cost = water tokens consumed at dawn (for equipped items with daily cost)
#   food_cost  = food tokens consumed at dawn
#   fuel_cost  = fuel tokens consumed at dawn
#   med_cost   = medicine tokens consumed at dawn
#   scrap_cost = scrap tokens consumed at dawn
#   terrain   = bitmask of movement perks while equipped (TERR_PASS_* in the .ino)
#               bit0 (1) = may enter River Channel (terrain 11) at MC 2
#               bit1 (2) = Mountain (terrain 8) costs MC 2 instead of 4 (climbing gear)
#               bit2 (4) = sealed: no Endure check when entering radioactive terrain
#   effect    = none | reveal_fog | narrative | threat_mod | cure_status
#   param     = effect parameter, by effect:
#               reveal_fog  : 1 = +1 vision radius while equipped
#                             2..98 = one-shot reveal of that radius on use
#                             99 = reveal the whole map on use
#               threat_mod  : signed byte added to the Threat Clock (on use, or each
#                             dawn while equipped). 253 = -3, 254 = -2, 2 = +2.
#               cure_status : number of wounds healed on use (minor first, then major)
#               narrative   : server-handled ids —
#                             10 teleport to a random surveyed hex (on use)
#                             20 REST upgrades a basic shelter to improved (equipped)
#                             21 no exposure LL loss at dawn (equipped)
#                             29 permanently lowers LL ceiling by 1 (on use)
#                             30 doubles scrap from SCAVENGE (equipped)
#                             31 doubles FORAGE yield on River Channel (equipped)
#                             32 doubles FORAGE yield on land hexes (equipped)
#                             client-only ids — 11 UI scramble, 12 reversed movement keys
#   effect2   = second effect (same values as effect)
#   param2    = second effect parameter
#
# Key items with an effect can be "used" any number of times and are never spent.
# Materials cannot be used; equipment must be equipped.
#
