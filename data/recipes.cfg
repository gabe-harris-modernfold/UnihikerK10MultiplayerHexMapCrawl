# ============================================================
# Wasteland Hex Crawl — Recipe Registry
# ============================================================
# Edit freely. Reboot ESP32 to reload. No firmware flash needed.
#
# Recipes are secret: nobody starts knowing any of them. A recipe is learned
# only by surviving a specific encounter node (a "recipe": N entry in that
# node's "loot" array — see data/encounters/settlement/15-20.json), then
# crafted at any Settlement hex via the CRAFT action (1 MP, no skill roll).
#
# Keys (all optional — missing keys default to 0/none):
#   id           = unique recipe ID (1-32; matches the "recipe" loot entry
#                  id and the bit set in a player's knownRecipes bitmask)
#   name         = display name (max 15 chars)
#   output_item  = ItemDef id this recipe produces
#   output_qty   = how many (default 1)
#   mat1/matqty1 = first required material ItemDef id + count
#   mat2/matqty2 = second required material (optional)
#   mat3/matqty3 = third required material (optional)
#   water_cost/food_cost/fuel_cost/med_cost/scrap_cost =
#                  resource tokens consumed, same order as trade steppers
#
# Keep data/game-data.js's RECIPES array byte-for-byte identical to this
# file — the client renders recipe cards from its own copy so the CRAFT
# panel doesn't need a server round-trip to know what a recipe needs.

